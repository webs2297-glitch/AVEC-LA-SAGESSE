<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion AVEC - Base Cloud Firebase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #f3f4f6;
            --surface: #ffffff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 20px; min-height: 100vh; }

        .dashboard-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 20px 28px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        @media (max-width: 1000px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

        .stat-card {
            background: var(--surface);
            padding: 18px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: white;
        }
        .bg-blue { background: var(--primary); }
        .bg-green { background: var(--success); }
        .bg-warning { background: var(--warning); }
        .bg-purple { background: #8b5cf6; }

        .stat-content .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .stat-content .value { font-size: 1.2rem; font-weight: 700; margin-top: 4px; }

        .grid-container { display: grid; grid-template-columns: 1.2fr 1.8fr; gap: 24px; }
        @media (max-width: 1000px) { .grid-container { grid-template-columns: 1fr; } }

        .card { background: var(--surface); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 24px; }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .card-header i { color: var(--primary); }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }

        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: var(--primary-dark); }

        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 8px; }
        th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: #f8fafc; color: var(--text-muted); }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <div>
            <h2><i class="fa-solid fa-fire"></i> Gestion AVEC - Base Cloud Firebase</h2>
            <p>Synchronisation en temps réel</p>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon bg-blue"><i class="fa-solid fa-wallet"></i></div>
            <div class="stat-content">
                <div class="label">Total Épargne Globale</div>
                <div class="value" id="statTotalEpargne">$0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-warning"><i class="fa-solid fa-hand-holding-dollar"></i></div>
            <div class="stat-content">
                <div class="label">Total Fonds Social</div>
                <div class="value" id="statTotalSocial">$0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-green"><i class="fa-solid fa-percent"></i></div>
            <div class="stat-content">
                <div class="label">Crédits en Cours</div>
                <div class="value" id="statTotalCredits">$0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-purple"><i class="fa-solid fa-users"></i></div>
            <div class="stat-content">
                <div class="label">Membres Actifs</div>
                <div class="value" id="statTotalMembres">0</div>
            </div>
        </div>
    </div>

    <div class="grid-container">
        <div>
            <section class="card">
                <div class="card-header"><i class="fa-solid fa-user-plus"></i><h3>Enregistrer un Membre</h3></div>
                <form id="addMemberForm">
                    <div class="form-group"><label>Nom & Post-nom</label><input type="text" id="memName" required placeholder="Ex: Bahati Alain"></div>
                    <div class="form-group"><label>Téléphone</label><input type="text" id="memPhone" placeholder="+243 ..."></div>
                    <div class="form-group"><label>Épargne Initiale ($)</label><input type="number" id="memEpargne" required min="0" placeholder="Ex: 100"></div>
                    <div class="form-group"><label>Social Initial ($)</label><input type="number" id="memSocial" required min="0" placeholder="Ex: 5"></div>
                    <button type="submit" class="btn">Enregistrer dans le Cloud</button>
                </form>
            </section>
        </div>

        <div>
            <section class="card">
                <div class="card-header"><i class="fa-solid fa-users"></i><h3>Répertoire des Membres (Cloud Firestore)</h3></div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Nom & Contact</th>
                                <th>Épargne ($)</th>
                                <th>Social ($)</th>
                            </tr>
                        </thead>
                        <tbody id="membersTableBody">
                            <tr><td colspan="3">Connexion à Firebase en cours...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <!-- SDK FIREBASE CONFIGURÉ AVEC TES CLÉS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFVFR95Q33ouclqeW9-qKGC6qXih690G0",
            authDomain: "base-de-donnee-avec.firebaseapp.com",
            projectId: "base-de-donnee-avec",
            storageBucket: "base-de-donnee-avec.firebasestorage.app",
            messagingSenderId: "759298772294",
            appId: "1:759298772294:web:a576fad9b9e9cac02a947",
            measurementId: "G-0Y3PN4PFV8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const membersRef = collection(db, "members");

        // Ajout d'un membre
        document.getElementById('addMemberForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('memName').value.trim();
            const phone = document.getElementById('memPhone').value.trim();
            const epargne = parseFloat(document.getElementById('memEpargne').value) || 0;
            const social = parseFloat(document.getElementById('memSocial').value) || 0;

            try {
                await addDoc(membersRef, {
                    name,
                    phone,
                    epargne,
                    social,
                    createdAt: new Date()
                });
                document.getElementById('addMemberForm').reset();
                alert("Membre enregistré avec succès dans Firebase !");
            } catch (error) {
                alert("Erreur : " + error.message);
            }
        });

        // Écoute en temps réel de la base de données Firestore
        onSnapshot(membersRef, (snapshot) => {
            const tbody = document.getElementById('membersTableBody');
            tbody.innerHTML = '';
            let totalEpargne = 0;
            let totalSocial = 0;
            let count = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                count++;
                totalEpargne += data.epargne || 0;
                totalSocial += data.social || 0;

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${data.name}</strong><br><small style="color:var(--text-muted);">${data.phone || '-'}</small></td>
                        <td>$${data.epargne || 0}</td>
                        <td>$${data.social || 0}</td>
                    </tr>
                `;
            });

            document.getElementById('statTotalEpargne').innerText = '$' + totalEpargne;
            document.getElementById('statTotalSocial').innerText = '$' + totalSocial;
            document.getElementById('statTotalMembres').innerText = count;
        });
    </script>
</body>
</html>
